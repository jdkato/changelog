# A version is the number alone. The tag may be v1.2.3; the heading is 1.2.3.
extends: existence
message: "Drop the 'v': '%s' should be '%s'."
link: https://semver.org/#is-v123-a-semantic-version
level: warning
scope: raw
nonword: true
action:
  name: edit
  params:
    - trim_left
    - 'vV'
raw:
  - '(?m)(?<=^##[ \t]+\[?)'
  - '[vV]\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?'
  - '(?=[\]\s]|$)'

tests:
  - name: fires
    input: |
      ## [v1.0.0] - 2017-06-20
    want: |
      1:5:Changelog.VersionPrefix:Drop the 'v': 'v1.0.0' should be '1.0.0'.
  - name: clean
    input: |
      ## [1.0.0] - 2017-06-20

      Tagged as v1.0.0.
    want: ""
