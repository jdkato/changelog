# Release dates are ISO 8601, YYYY-MM-DD: one order for every reader, and it
# sorts. Month names and day-first or month-first numbers are flagged.
extends: existence
message: "Write the release date as YYYY-MM-DD, not '%s'."
link: https://keepachangelog.com/en/1.1.0/#confusing-dates
level: error
scope: raw
nonword: true
ignorecase: true
raw:
  - '(?m)(?<=^##[ \t]+\S[^\n]*[ \t(])(?:'
  # 2017/06/20, 2017.6.20, 2017-6-20
  - '\d{4}[/.]\d{1,2}[/.]\d{1,2}|\d{4}-(?:\d-\d{1,2}|\d{2}-\d)(?!\d)'
  # 20/06/2017, 06-20-2017, 20.06.2017
  - '|\d{1,2}[/.-]\d{1,2}[/.-](?:\d{4}|\d{2})'
  # June 20, 2017; Jun 20th 2017; 20 June 2017; June 2017
  - '|(?:\d{1,2}(?:st|nd|rd|th)?[ \t]+)?'
  - '(?:Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|June?|July?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)\.?'
  - '(?:[ \t]+\d{1,2}(?:st|nd|rd|th)?)?,?[ \t]+\d{4}'
  - ')(?![\d.])'

tests:
  - name: fires
    input: |
      ## [1.3.0] - 2017/06/20

      ## [1.2.0] - 2017-6-2

      ## [1.1.0] - 06/20/2017

      ## [1.0.0] - June 20, 2017

      ## [0.9.0] - 3rd May 2017
    want: |
      1:14:Changelog.DateFormat:Write the release date as YYYY-MM-DD, not '2017/06/20'.
      3:14:Changelog.DateFormat:Write the release date as YYYY-MM-DD, not '2017-6-2'.
      5:14:Changelog.DateFormat:Write the release date as YYYY-MM-DD, not '06/20/2017'.
      7:14:Changelog.DateFormat:Write the release date as YYYY-MM-DD, not 'June 20, 2017'.
      9:14:Changelog.DateFormat:Write the release date as YYYY-MM-DD, not '3rd May 2017'.
  - name: clean
    input: |
      ## [2024.1.2] - 2024-01-02

      ## [10.11.12] - 2017-06-20

      Released June 20, 2017.
    want: ""
